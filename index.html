<!doctype html>
<html lang="id" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Uang">
<meta name="theme-color" content="#2F6FDB"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Catatan Uang</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#14233F;--mut:#62748F;--line:#D8E3F5;--acc:#2F6FDB;--out:#D64545;--warn:#D9962B;--on:#fff;--hero:#1E4FA8;--heroink:#fff;--heromut:#BBD3FA;--bubble:#2F6FDB;--bbd:transparent}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:22px 0 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}

.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mon{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mon b{flex:1;text-align:center;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
.ic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;font-size:18px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:650;margin-top:14px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:transparent;color:var(--out);border:1px solid var(--out)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{font-variant-numeric:tabular-nums;display:block}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.amt.out{color:var(--ink)}.amt.in{color:var(--acc)}.amt.tf{color:var(--mut)}
.dh{font-size:13px;color:var(--mut);margin:14px 2px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut)}nav button.on{color:var(--acc);font-weight:700}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on);font-size:30px;margin-top:-22px;padding:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet.show{display:flex}#sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px 4px;font-size:14px;border-radius:10px;border:1px solid var(--line);background:none}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.warn{border-color:var(--warn)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px}
.chip b{color:var(--out);cursor:pointer;font-weight:400}
.hero{background:var(--hero);color:var(--heroink);border-radius:24px;padding:20px 18px 18px;margin:4px 0 12px}
.hero .hi{font-size:14px;color:var(--heromut)}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin:2px 0 12px}
.hero .qt{font-size:15px;line-height:1.5;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.ico{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.tx{align-items:center}.tx>div:nth-child(2){flex:1;min-width:0}.tx .mut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{border-radius:18px}h2{font-size:17px;font-weight:750}.bar{height:10px}
.empty{text-align:center;padding:22px 8px}.empty .e{font-size:34px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:9}
.card{background:var(--bubble);color:#fff;border:1px solid var(--bbd);border-radius:22px;--ink:#fff;--mut:#D3E3FF;--line:rgba(255,255,255,.24);--acc:#fff}
.card.warn{border:2px solid var(--warn)}
.card input,.card select{background:#fff;color:#14233F;border-color:transparent}
.card .btn{background:#fff;color:#1E4FA8}
.card .btn.alt{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.card .ic{background:#fff;color:#1E4FA8;border-color:transparent}
.card .ico{background:rgba(255,255,255,.2)!important}
.card .amt.in{color:#B4F2CE}.card .chip b{color:#FFD3D3}.card .bar{background:rgba(255,255,255,.25)}
.hero{background:var(--hero);position:relative;overflow:hidden}
.credit{text-align:center;color:var(--mut);font-size:13px;margin:26px 0 6px}

:root[data-theme=dark]{color-scheme:dark;--bg:#0C1527;--card:#13213D;--ink:#E8EEFA;--mut:#93A6C9;--line:#22345A;--acc:#6FA3FF;--on:#0C1527;--hero:#2F6FDB;--bubble:#17315F;--bbd:rgba(130,170,255,.2);--out:#F07A7A;--warn:#E8B04A}
:root[data-theme=dark] .card input,:root[data-theme=dark] .card select{background:#0F2145;color:#fff}
.card .seg button{border-color:rgba(255,255,255,.4)}.card .seg button.on{background:#fff;color:#1E4FA8}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);z-index:0}
.hero::after{right:-40px;bottom:-50px;width:150px;height:150px}.hero::before{right:62px;bottom:-34px;width:72px;height:72px;background:rgba(255,255,255,.07)}
.hero>div{position:relative;z-index:1}.hero .hi{padding-right:56px}
.logo{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:12px;z-index:1}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
nav button.on{background:var(--line);border-radius:18px}
nav .add{box-shadow:0 6px 16px rgba(47,111,219,.55)}
</style></head><body>
<main id="app"></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="form"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='catatanuang.v1';
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const DEF=['Makan','Transportasi','Belanja','Tagihan','Kesehatan','Hiburan','Pendidikan','Lainnya'];
let S,tab='home',mon=today().slice(0,7),q='',editId=null,type='out';
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S||!Array.isArray(S.tx))S={tx:[],wallets:[{id:'w1',name:'Tunai',start:0}],budgets:{},cats:DEF.slice(),lastBackup:0,lastWallet:'w1'}
 mig()}
function mig(){if(S.v2)return;[['w1','Tunai'],['w2','m-Banking'],['w3','ShopeePay'],['w4','OVO'],['w5','GoPay']].forEach(([id,n])=>{if(!S.wallets.some(w=>w.id===id||w.name.toLowerCase()===n.toLowerCase()))S.wallets.push({id,name:n,start:0})});S.v2=1;save()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Gagal menyimpan. Penyimpanan penuh atau diblokir. Segera backup data.')}}
const num=v=>parseInt(String(v).replace(/\D/g,''))||0;
const fmtIn=el=>{const n=num(el.value);el.value=n?n.toLocaleString('id-ID'):''};
const mt=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const wname=id=>(S.wallets.find(w=>w.id===id)||{name:'?'}).name;
const EM={Makan:'🍜',Transportasi:'🛵',Belanja:'🛍️',Tagihan:'🧾',Kesehatan:'💊',Hiburan:'🎬',Pendidikan:'📚',Lainnya:'📦'};
const PAL=['#2F6FDB','#5B9BF0','#1E4FA8','#4AA3DF','#6C7FD8','#3A86C8','#7FA0E8','#2B5FB8'];
const cc=c=>PAL[Math.max(0,S.cats.indexOf(c))%PAL.length];
const ico=t=>`<span class="ico" style="background:${t.type==='in'?'#2F6FDB':t.type==='tf'?'#8A9BB8':cc(t.cat)}26">${t.type==='in'?'💰':t.type==='tf'?'🔁':(EM[t.cat]||'🏷️')}</span>`;
const wic=n=>{n=n.toLowerCase();return n.includes('tunai')?'💵':n.includes('bank')?'🏦':n.includes('shopee')?'🛒':n.includes('ovo')?'💜':n.includes('gopay')?'🟢':'👛'};
const MSG=['Mencatat itu kebiasaan kecil yang dampaknya besar.','Yang kecil-kecil kalau dikumpulkan jadi besar. Catat semuanya.','Uang yang dicatat lebih mudah diatur.','Bukan soal pelit, tapi soal tahu ke mana uang pergi.','Tabung dulu, belanja kemudian.','Satu catatan hari ini menyelamatkan dompet bulan depan.','Beli yang dibutuhkan, tunda yang diinginkan.','Pelan-pelan, asal rutin mencatat.','Jajan boleh, asal sadar dan tercatat.','Dompet yang tertata bikin hati lebih tenang.','Cek anggaranmu dulu sebelum checkout.','Hari ini hemat sedikit, besok lega banyak.','Kebebasan finansial dimulai dari satu baris catatan.','Catat sekarang, jangan tunggu sampai lupa.'];
function hello(){const h=new Date().getHours();return h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'}
function note(){const sp=bycat(mt(today().slice(0,7)));
 for(const c of S.cats){const b=S.budgets[c];if(b&&(sp[c]||0)>b)return 'Anggaran '+c+' bulan ini sudah terlewati. Tahan dulu pengeluaran yang tidak perlu ya.'}
 for(const c of S.cats){const b=S.budgets[c];if(b&&(sp[c]||0)>b*.8)return 'Anggaran '+c+' tinggal sedikit lagi. Pelan-pelan ya.'}
 if(!S.tx.length)return 'Selamat datang! Ketuk tombol + untuk mencatat pengeluaran pertamamu.';
 if(!S.tx.some(t=>t.date===today()))return 'Belum ada catatan hari ini. Yuk catat sebelum lupa.';
 return MSG[Math.floor(Date.now()/864e5)%MSG.length]}
function trend(){const[y,m]=mon.split('-').map(Number),ks=[];
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);ks.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
 const D=ks.map(k=>{const a=mt(k);return{k,o:sum(a,'out'),i:sum(a,'in')}}),mx=Math.max(1,...D.map(d=>Math.max(d.o,d.i)));
 const g=D.map((d,j)=>{const x=j*53+10,ho=d.o/mx*88,hi=d.i/mx*88,on=d.k===mon;
  return `<rect x="${x}" y="${100-hi}" width="14" height="${hi}" rx="3" fill="#A9C8FF"/><rect x="${x+16}" y="${100-ho}" width="14" height="${ho}" rx="3" fill="var(--acc)" opacity="${on?1:.55}"/><text x="${x+15}" y="116" text-anchor="middle" font-size="11" fill="var(--mut)"${on?' font-weight="700"':''}>${new Date(d.k+'-01T00:00').toLocaleDateString('id-ID',{month:'short'})}</text>`}).join('');
 const c=D[5].o,p=D[4].o,cur=mon===today().slice(0,7);
 const t=!p?'':cur?`Bulan ini baru ${rp(c)} dari ${rp(p)} pengeluaran bulan lalu.`:c>p?`Pengeluaran naik ${Math.round((c-p)/p*100)}% dari bulan sebelumnya.`:c<p?`Pengeluaran turun ${Math.round((p-c)/p*100)}% dari bulan sebelumnya. Bagus, pertahankan!`:'Sama persis dengan bulan sebelumnya.';
 return `<svg viewBox="0 0 320 122" width="100%" role="img" aria-label="Tren pengeluaran dan pemasukan 6 bulan">${g}</svg><div class="mut" style="margin-top:6px"><span style="color:#A9C8FF">■</span> Pemasukan &nbsp; <span style="color:var(--acc)">■</span> Pengeluaran</div>${t?`<div style="margin-top:8px">${t}</div>`:''}`}
function daily(){const[y,m]=mon.split('-').map(Number),dim=new Date(y,m,0).getDate(),v=Array(dim).fill(0);
 mt(mon).forEach(t=>{if(t.type==='out')v[+t.date.slice(8)-1]+=t.amt});
 const mx=Math.max(1,...v),w=320/dim;
 return `<svg viewBox="0 0 320 100" width="100%" role="img" aria-label="Pengeluaran harian">${v.map((n,i)=>{const h=n?Math.max(2,n/mx*76):0;return `<rect x="${i*w+1}" y="${80-h}" width="${w-2}" height="${h}" rx="2" fill="var(--acc)"/>`}).join('')}<line x1="0" x2="320" y1="80.5" y2="80.5" stroke="var(--line)"/><text x="0" y="96" font-size="11" fill="var(--mut)">1</text><text x="160" y="96" text-anchor="middle" font-size="11" fill="var(--mut)">${Math.ceil(dim/2)}</text><text x="320" y="96" text-anchor="end" font-size="11" fill="var(--mut)">${dim}</text></svg><div class="mut">Tertinggi: ${rp(Math.max(...v))} dalam sehari</div>`}
function applyTheme(){const t=S.theme||'dark';document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0C1527':'#2F6FDB'}
function setTheme(t){S.theme=t;save();render()}
const nm=()=>S.name||'Annisa Natapuspita';
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
const mlabel=m=>{const[y,n]=m.split('-');return new Date(y,n-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
function shift(d){let[y,m]=mon.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}mon=y+'-'+pad(m);render()}
const monBar=()=>`<div class="mon"><button class="ic" onclick="shift(-1)" aria-label="Bulan sebelumnya">‹</button><b>${mlabel(mon)}</b><button class="ic" onclick="shift(1)" aria-label="Bulan berikutnya">›</button></div>`;
function bycat(a){const m={};a.filter(t=>t.type==='out').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return m}
function home(){
 const a=mt(mon),o=sum(a,'out'),i=sum(a,'in'),[y,m]=mon.split('-').map(Number),dim=new Date(y,m,0).getDate();
 const cur=mon===today().slice(0,7),day=cur?+today().slice(8):dim,avg=o/day;
 const bc=Object.entries(bycat(a)).sort((x,z)=>z[1]-x[1]),mx=bc.length?bc[0][1]:1;
 const old=Date.now()-S.lastBackup>7*864e5;
 return (old&&S.tx.length?`<div class="card warn row"><span>${S.lastBackup?'Sudah lebih dari 7 hari sejak backup terakhir.':'Data belum pernah di-backup.'}</span><button class="ic" style="width:auto;padding:0 12px;font-size:14px" onclick="go('set')">Backup</button></div>`:'')+
 monBar()+`<div class="hero"><img class="logo" src="icon.png" alt="" onerror="this.remove()"><div class="hi">${hello()}, ${esc(nm())} 👋</div><div class="hi">Pengeluaran ${mlabel(mon)}</div><div class="big">${rp(o)}</div><div class="qt">${esc(note())}</div></div>
 <div class="stats" style="margin:10px 0"><div class="card"><span class="mut">Pemasukan</span><b>${rp(i)}</b></div><div class="card"><span class="mut">Selisih</span><b>${rp(i-o)}</b></div>
 <div class="card"><span class="mut">Rata-rata per hari</span><b>${rp(avg)}</b></div><div class="card"><span class="mut">${cur?'Perkiraan akhir bulan':'Jumlah transaksi'}</span><b>${cur?rp(avg*dim):a.length}</b></div></div>
 <h2>Per kategori</h2><div class="card">${bc.length?bc.map(([c,v])=>`<div style="margin-bottom:12px"><div class="row"><span style="display:flex;gap:10px;align-items:center"><span class="ico" style="background:${cc(c)}26;flex-basis:34px;width:34px;height:34px;font-size:16px">${EM[c]||'🏷️'}</span>${esc(c)}</span><span class="amt">${rp(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'<div class="empty"><div class="e">🌱</div><div>Belum ada pengeluaran bulan ini.</div><div class="mut">Ketuk + di bawah untuk mulai mencatat.</div></div>'}</div>
 <h2>Tren 6 bulan</h2><div class="card">${trend()}</div><h2>Pengeluaran harian</h2><div class="card">${daily()}</div><h2>Saldo dompet</h2><div class="card">${S.wallets.map(w=>`<div class="row" style="padding:5px 0"><span>${wic(w.name)} ${esc(w.name)}</span><span class="amt">${rp(bal(w))}</span></div>`).join('')}</div>`}
function bal(w){return w.start+S.tx.reduce((s,t)=>t.type==='tf'?s+(t.to===w.id?t.amt:0)-(t.wallet===w.id?t.amt:0):t.wallet===w.id?s+(t.type==='in'?t.amt:-t.amt):s,0)}
function list(){
 const k=q.trim().toLowerCase();
 let a=k?S.tx.filter(t=>[t.note,t.cat,t.sub,wname(t.wallet)].join(' ').toLowerCase().includes(k)):mt(mon);
 a=a.slice().sort((x,z)=>z.date.localeCompare(x.date)||z.id.localeCompare(x.id));
 let h='',d='';
 a.forEach(t=>{if(t.date!==d){d=t.date;h+=`<div class="dh">${new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`}
  h+=`<div class="tx" onclick="openSheet('${t.id}')">${ico(t)}<div><div>${esc(t.cat)}${t.sub?' › '+esc(t.sub):''}</div><div class="mut">${esc(t.type==='tf'?wname(t.wallet)+' → '+wname(t.to):wname(t.wallet))}${t.note?' · '+esc(t.note):''}</div></div><div class="amt ${t.type}">${t.type==='in'?'+':t.type==='tf'?'':'-'}${rp(t.amt)}</div></div>`});
 return (k?'':monBar())+`<input type="search" placeholder="Cari catatan, kategori, dompet" value="${esc(q)}" oninput="q=this.value;renderKeep()" id="qi">
 <div class="card" style="margin-top:10px">${h||`<div class="empty"><div class="e">${k?'🔍':'📝'}</div><div>${k?'Tidak ada hasil.':'Belum ada transaksi bulan ini.'}</div><div class="mut">${k?'Coba kata kunci lain.':'Ketuk + untuk mencatat yang pertama.'}</div></div>`}</div>`}
function budget(){
 const sp=bycat(mt(mon));
 return monBar()+`<p class="mut">Isi batas bulanan per kategori. Kosongkan kalau tidak perlu.</p>`+S.cats.map(c=>{
  const b=S.budgets[c]||0,v=sp[c]||0,p=b?v/b:0,col=p>1?'var(--out)':p>.8?'var(--warn)':'var(--acc)';
  return `<div class="card"><div class="row"><b>${esc(c)}</b><span class="mut">${rp(v)}${b?' / '+rp(b):''}</span></div>
  ${b?`<div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${col}"></i></div><div class="mut" style="margin-top:4px">${p>1?'Lewat '+rp(v-b):'Sisa '+rp(b-v)}</div>`:''}
  <input inputmode="numeric" placeholder="Batas bulanan (Rp)" value="${b?b.toLocaleString('id-ID'):''}" oninput="fmtIn(this)" onchange="setB('${esc(c).replace(/'/g,"\\'")}',this.value)" style="margin-top:8px"></div>`}).join('')}
function setB(c,v){const n=num(v);if(n)S.budgets[c]=n;else delete S.budgets[c];save();render()}
function settings(){
 return `<h2>Pengguna</h2><div class="card"><label style="margin-top:0">Nama</label><input value="${esc(nm())}" onchange="S.name=this.value.trim()||'Annisa Natapuspita';save();toast('Nama disimpan ✓')"></div><h2>Tampilan</h2><div class="card"><div class="seg"><button class="${(S.theme||'dark')==='light'?'on':''}" onclick="setTheme('light')">☀️ Terang</button><button class="${(S.theme||'dark')==='dark'?'on':''}" onclick="setTheme('dark')">🌙 Gelap</button></div></div><h2>Dompet</h2><div class="card">${S.wallets.map(w=>`<div class="row" style="margin-bottom:10px"><input value="${esc(w.name)}" onchange="rename('${w.id}',this.value)"><span class="amt" style="min-width:110px;text-align:right">${rp(bal(w))}</span><button class="ic" onclick="delW('${w.id}')" aria-label="Hapus dompet">×</button></div>`).join('')}
 <div class="g2"><input id="wn" placeholder="Nama dompet baru"><input id="ws" inputmode="numeric" placeholder="Saldo awal" oninput="fmtIn(this)"></div><button class="btn alt" onclick="addW()">Tambah dompet</button></div>
 <h2>Kategori</h2><div class="card">${S.cats.map(c=>`<span class="chip">${esc(c)} <b onclick="delC('${esc(c).replace(/'/g,"\\'")}')">×</b></span>`).join('')}
 <div class="row" style="margin-top:6px"><input id="cn" placeholder="Kategori baru"><button class="ic" style="width:auto;padding:0 14px" onclick="addC()">Tambah</button></div></div>
 <h2>Backup</h2><div class="card"><p class="mut" style="margin-top:0">Data tersimpan di iPhone ini saja. Backup berkala lewat Files atau AirDrop. Terakhir: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'belum pernah'}.</p>
 <button class="btn" style="margin-top:0" onclick="exp()">Backup data</button>
 <button class="btn alt" onclick="exCsv()">Ekspor CSV (untuk Excel)</button>
 <button class="btn alt" onclick="$('#imp').click()">Pulihkan dari file backup</button><input type="file" id="imp" accept=".json,application/json" hidden onchange="imp(this.files[0])"></div>`}
function rename(id,v){const w=S.wallets.find(x=>x.id===id);if(w&&v.trim()){w.name=v.trim();save()}}
function delW(id){if(S.tx.some(t=>t.wallet===id||t.to===id))return alert('Dompet ini sudah dipakai di transaksi, jadi tidak bisa dihapus. Ganti namanya kalau perlu.');
 if(S.wallets.length<2)return alert('Harus ada minimal satu dompet.');S.wallets=S.wallets.filter(w=>w.id!==id);save();render()}
function addW(){const n=$('#wn').value.trim();if(!n)return alert('Isi nama dompet dulu.');S.wallets.push({id:'w'+Date.now(),name:n,start:num($('#ws').value)});save();render()}
function addC(){const n=$('#cn').value.trim();if(!n||S.cats.includes(n))return;S.cats.push(n);save();render()}
function delC(c){if(S.tx.some(t=>t.cat===c))return alert('Kategori ini sudah dipakai di transaksi, jadi tidak bisa dihapus.');S.cats=S.cats.filter(x=>x!==c);delete S.budgets[c];save();render()}
function openSheet(id){
 editId=id||null;const t=id?S.tx.find(x=>x.id===id):null;type=t?t.type:'out';
 const tgt=t&&t.to?t.to:(S.wallets.find(w=>w.id!==S.lastWallet)||{}).id;const cats=S.cats.map(c=>`<option ${t&&t.cat===c?'selected':''}>${esc(c)}</option>`).join('');
 $('#form').innerHTML=`<div class="seg" id="seg"><button onclick="setType('out')" class="${type==='out'?'on':''}">Pengeluaran</button><button onclick="setType('in')" class="${type==='in'?'on':''}">Pemasukan</button><button onclick="setType('tf')" class="${type==='tf'?'on':''}">Transfer</button></div>
 <label>Nominal (Rp)</label><input id="fa" inputmode="numeric" placeholder="0" oninput="fmtIn(this)" value="${t?t.amt.toLocaleString('id-ID'):''}" style="font-size:24px;font-weight:700">
 <div class="g2" id="rc"><div><label>Kategori</label><select id="fc">${cats}</select></div><div><label>Subkategori</label><input id="fs" placeholder="mis. kopi" value="${t?esc(t.sub):''}"></div></div>
 <div class="g2"><div><label id="lw">Dompet</label><select id="fw">${S.wallets.map(w=>`<option value="${w.id}" ${(t?t.wallet:S.lastWallet)===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div><label>Tanggal</label><input id="fd" type="date" value="${t?t.date:today()}"></div></div>
 <div id="rt"><label>Ke dompet</label><select id="ft">${S.wallets.map(w=>`<option value="${w.id}" ${w.id===tgt?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
 <label>Catatan</label><input id="fn" placeholder="Opsional" value="${t?esc(t.note):''}">
 <button class="btn" onclick="saveTx()">${t?'Simpan perubahan':'Simpan'}</button>${t?'<button class="btn del" onclick="delTx()">Hapus transaksi</button>':''}<button class="btn alt" onclick="closeSheet()">Batal</button>`;
 setType(type);$('#sheet').classList.add('show');if(!t)setTimeout(()=>$('#fa').focus(),50)}
function setType(t){type=t;[...$('#seg').children].forEach((b,i)=>b.classList.toggle('on',['out','in','tf'][i]===t));const f=t==='tf';$('#rc').style.display=f?'none':'';$('#rt').style.display=f?'':'none';$('#lw').textContent=f?'Dari dompet':'Dompet'}
function closeSheet(){$('#sheet').classList.remove('show')}
function saveTx(){
 const amt=num($('#fa').value);if(!amt)return alert('Isi nominal dulu.');
 const d=$('#fd').value||today(),f=type==='tf',w=$('#fw').value,to=$('#ft').value;
 if(f&&w===to)return alert(S.wallets.length<2?'Transfer butuh minimal dua dompet.':'Pilih dua dompet yang berbeda.');
 const r={type,amt,cat:f?'Transfer':$('#fc').value,sub:f?'':$('#fs').value.trim(),wallet:w,to:f?to:'',date:d,note:$('#fn').value.trim()};
 if(editId){Object.assign(S.tx.find(t=>t.id===editId),r)}else S.tx.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)},r));
 S.lastWallet=r.wallet;save();mon=d.slice(0,7);closeSheet();render();toast(editId?'Perubahan tersimpan ✓':'Tercatat ✓')}
function delTx(){if(confirm('Hapus transaksi ini?')){S.tx=S.tx.filter(t=>t.id!==editId);save();closeSheet();render()}}
function stamp(){S.lastBackup=Date.now();save();render()}
async function out(name,text,mime){
 const f=new File([text],name,{type:mime});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();return true}
async function exp(){if(await out('catatan-uang-'+today()+'.json',JSON.stringify(S),'application/json'))stamp()}
function exCsv(){const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
 out('catatan-uang-'+today()+'.csv',['Tanggal,Jenis,Nominal,Kategori,Subkategori,Dompet,Catatan'].concat(S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'Pemasukan':t.type==='tf'?'Transfer':'Pengeluaran',t.amt,c(t.cat),c(t.sub),c(t.type==='tf'?wname(t.wallet)+' > '+wname(t.to):wname(t.wallet)),c(t.note)].join(','))).join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!Array.isArray(d.wallets))throw 0;
 if(!confirm('Data sekarang akan diganti dengan isi file ('+d.tx.length+' transaksi). Lanjutkan?'))return;S=d;mig();save();alert('Data berhasil dipulihkan.');render()}catch(e){alert('File tidak dikenali. Pilih file backup dari aplikasi ini.')}};r.readAsText(f)}
function go(t){tab=t;render();scrollTo(0,0)}
function nav(){const b=(id,l,i)=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><span style="font-size:20px;display:block;filter:${tab===id?'none':'grayscale(1) opacity(.6)'}">${i}</span>${l}</button>`;
 $('#nav').innerHTML=b('home','Beranda','🏠')+b('list','Transaksi','🧾')+'<button class="add" onclick="openSheet()" aria-label="Catat transaksi">+</button>'+b('bud','Anggaran','🎯')+b('set','Pengaturan','⚙️')}
function render(){applyTheme();nav();$('#app').innerHTML={home,list,bud:budget,set:settings}[tab]()+'<div class="credit">Catatan Uang · dibuat oleh Masbie</div>'}
function renderKeep(){const p=$('#qi').selectionStart;render();const i=$('#qi');i.focus();i.setSelectionRange(p,p)}
load();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
