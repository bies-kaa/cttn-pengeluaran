<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Uang">
<meta name="theme-color" content="#1F6F5C">
<title>Catatan Uang</title>
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#17252A;--mut:#6B7C80;--line:#DCE5E3;--acc:#1F6F5C;--out:#B4452B;--warn:#C98A12;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0E1A1D;--card:#16262A;--ink:#E6EEEE;--mut:#8FA3A6;--line:#26393D;--acc:#4DB89C;--out:#E58467;--warn:#E0A93A;--on:#0E1A1D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:15px;margin:22px 0 8px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{padding:6px 2px 4px}.hero .big{font-size:40px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mon{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mon b{flex:1;text-align:center;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
.ic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;font-size:18px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-weight:650;margin-top:14px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:transparent;color:var(--out);border:1px solid var(--out)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{font-variant-numeric:tabular-nums;display:block}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.amt.out{color:var(--out)}.amt.in{color:var(--acc)}
.dh{font-size:13px;color:var(--mut);margin:14px 2px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut)}nav button.on{color:var(--acc);font-weight:700}
nav .add{flex:0 0 56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on);font-size:30px;margin-top:-22px;padding:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet.show{display:flex}#sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:none}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.warn{border-color:var(--warn)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px}
.chip b{color:var(--out);cursor:pointer;font-weight:400}
</style></head><body>
<main id="app"></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="form"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),K='catatanuang.v1';
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const DEF=['Makan','Transportasi','Belanja','Tagihan','Kesehatan','Hiburan','Pendidikan','Lainnya'];
let S,tab='home',mon=today().slice(0,7),q='',editId=null,type='out';
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S||!Array.isArray(S.tx))S={tx:[],wallets:[{id:'w1',name:'Tunai',start:0}],budgets:{},cats:DEF.slice(),lastBackup:0,lastWallet:'w1'}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Gagal menyimpan. Penyimpanan penuh atau diblokir. Segera backup data.')}}
const num=v=>parseInt(String(v).replace(/\D/g,''))||0;
const fmtIn=el=>{const n=num(el.value);el.value=n?n.toLocaleString('id-ID'):''};
const mt=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const wname=id=>(S.wallets.find(w=>w.id===id)||{name:'?'}).name;
const mlabel=m=>{const[y,n]=m.split('-');return new Date(y,n-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
function shift(d){let[y,m]=mon.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}mon=y+'-'+pad(m);render()}
const monBar=()=>`<div class="mon"><button class="ic" onclick="shift(-1)" aria-label="Bulan sebelumnya">‹</button><b>${mlabel(mon)}</b><button class="ic" onclick="shift(1)" aria-label="Bulan berikutnya">›</button></div>`;
function bycat(a){const m={};a.filter(t=>t.type==='out').forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return m}
function home(){
 const a=mt(mon),o=sum(a,'out'),i=sum(a,'in'),[y,m]=mon.split('-').map(Number),dim=new Date(y,m,0).getDate();
 const cur=mon===today().slice(0,7),day=cur?+today().slice(8):dim,avg=o/day;
 const bc=Object.entries(bycat(a)).sort((x,z)=>z[1]-x[1]),mx=bc.length?bc[0][1]:1;
 const old=Date.now()-S.lastBackup>7*864e5;
 return (old&&S.tx.length?`<div class="card warn row"><span>${S.lastBackup?'Sudah lebih dari 7 hari sejak backup terakhir.':'Data belum pernah di-backup.'}</span><button class="ic" style="width:auto;padding:0 12px;font-size:14px" onclick="go('set')">Backup</button></div>`:'')+
 monBar()+`<div class="hero"><div class="mut">Pengeluaran</div><div class="big">${rp(o)}</div></div>
 <div class="stats" style="margin:10px 0"><div class="card"><span class="mut">Pemasukan</span><b>${rp(i)}</b></div><div class="card"><span class="mut">Selisih</span><b>${rp(i-o)}</b></div>
 <div class="card"><span class="mut">Rata-rata per hari</span><b>${rp(avg)}</b></div><div class="card"><span class="mut">${cur?'Perkiraan akhir bulan':'Jumlah transaksi'}</span><b>${cur?rp(avg*dim):a.length}</b></div></div>
 <h2>Per kategori</h2><div class="card">${bc.length?bc.map(([c,v])=>`<div style="margin-bottom:12px"><div class="row"><span>${esc(c)}</span><span class="amt">${rp(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'<span class="mut">Belum ada pengeluaran bulan ini. Ketuk + untuk mencatat.</span>'}</div>
 <h2>Saldo dompet</h2><div class="card">${S.wallets.map(w=>`<div class="row" style="padding:5px 0"><span>${esc(w.name)}</span><span class="amt">${rp(bal(w))}</span></div>`).join('')}</div>`}
function bal(w){return w.start+S.tx.filter(t=>t.wallet===w.id).reduce((s,t)=>s+(t.type==='in'?t.amt:-t.amt),0)}
function list(){
 const k=q.trim().toLowerCase();
 let a=k?S.tx.filter(t=>[t.note,t.cat,t.sub,wname(t.wallet)].join(' ').toLowerCase().includes(k)):mt(mon);
 a=a.slice().sort((x,z)=>z.date.localeCompare(x.date)||z.id.localeCompare(x.id));
 let h='',d='';
 a.forEach(t=>{if(t.date!==d){d=t.date;h+=`<div class="dh">${new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`}
  h+=`<div class="tx" onclick="openSheet('${t.id}')"><div><div>${esc(t.cat)}${t.sub?' › '+esc(t.sub):''}</div><div class="mut">${esc(wname(t.wallet))}${t.note?' · '+esc(t.note):''}</div></div><div class="amt ${t.type}">${t.type==='in'?'+':'-'}${rp(t.amt)}</div></div>`});
 return (k?'':monBar())+`<input type="search" placeholder="Cari catatan, kategori, dompet" value="${esc(q)}" oninput="q=this.value;renderKeep()" id="qi">
 <div class="card" style="margin-top:10px">${h||`<span class="mut">${k?'Tidak ada hasil.':'Belum ada transaksi bulan ini.'}</span>`}</div>`}
function budget(){
 const sp=bycat(mt(mon));
 return monBar()+`<p class="mut">Isi batas bulanan per kategori. Kosongkan kalau tidak perlu.</p>`+S.cats.map(c=>{
  const b=S.budgets[c]||0,v=sp[c]||0,p=b?v/b:0,col=p>1?'var(--out)':p>.8?'var(--warn)':'var(--acc)';
  return `<div class="card"><div class="row"><b>${esc(c)}</b><span class="mut">${rp(v)}${b?' / '+rp(b):''}</span></div>
  ${b?`<div class="bar"><i style="width:${Math.min(p,1)*100}%;background:${col}"></i></div><div class="mut" style="margin-top:4px">${p>1?'Lewat '+rp(v-b):'Sisa '+rp(b-v)}</div>`:''}
  <input inputmode="numeric" placeholder="Batas bulanan (Rp)" value="${b?b.toLocaleString('id-ID'):''}" oninput="fmtIn(this)" onchange="setB('${esc(c).replace(/'/g,"\\'")}',this.value)" style="margin-top:8px"></div>`}).join('')}
function setB(c,v){const n=num(v);if(n)S.budgets[c]=n;else delete S.budgets[c];save();render()}
function settings(){
 return `<h2>Dompet</h2><div class="card">${S.wallets.map(w=>`<div class="row" style="margin-bottom:10px"><input value="${esc(w.name)}" onchange="rename('${w.id}',this.value)"><span class="amt" style="min-width:110px;text-align:right">${rp(bal(w))}</span><button class="ic" onclick="delW('${w.id}')" aria-label="Hapus dompet">×</button></div>`).join('')}
 <div class="g2"><input id="wn" placeholder="Nama dompet baru"><input id="ws" inputmode="numeric" placeholder="Saldo awal" oninput="fmtIn(this)"></div><button class="btn alt" onclick="addW()">Tambah dompet</button></div>
 <h2>Kategori</h2><div class="card">${S.cats.map(c=>`<span class="chip">${esc(c)} <b onclick="delC('${esc(c).replace(/'/g,"\\'")}')">×</b></span>`).join('')}
 <div class="row" style="margin-top:6px"><input id="cn" placeholder="Kategori baru"><button class="ic" style="width:auto;padding:0 14px" onclick="addC()">Tambah</button></div></div>
 <h2>Backup</h2><div class="card"><p class="mut" style="margin-top:0">Data tersimpan di iPhone ini saja. Backup berkala lewat Files atau AirDrop. Terakhir: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'belum pernah'}.</p>
 <button class="btn" style="margin-top:0" onclick="exp()">Backup data</button>
 <button class="btn alt" onclick="exCsv()">Ekspor CSV (untuk Excel)</button>
 <button class="btn alt" onclick="$('#imp').click()">Pulihkan dari file backup</button><input type="file" id="imp" accept=".json,application/json" hidden onchange="imp(this.files[0])"></div>`}
function rename(id,v){const w=S.wallets.find(x=>x.id===id);if(w&&v.trim()){w.name=v.trim();save()}}
function delW(id){if(S.tx.some(t=>t.wallet===id))return alert('Dompet ini sudah dipakai di transaksi, jadi tidak bisa dihapus. Ganti namanya kalau perlu.');
 if(S.wallets.length<2)return alert('Harus ada minimal satu dompet.');S.wallets=S.wallets.filter(w=>w.id!==id);save();render()}
function addW(){const n=$('#wn').value.trim();if(!n)return alert('Isi nama dompet dulu.');S.wallets.push({id:'w'+Date.now(),name:n,start:num($('#ws').value)});save();render()}
function addC(){const n=$('#cn').value.trim();if(!n||S.cats.includes(n))return;S.cats.push(n);save();render()}
function delC(c){if(S.tx.some(t=>t.cat===c))return alert('Kategori ini sudah dipakai di transaksi, jadi tidak bisa dihapus.');S.cats=S.cats.filter(x=>x!==c);delete S.budgets[c];save();render()}
function openSheet(id){
 editId=id||null;const t=id?S.tx.find(x=>x.id===id):null;type=t?t.type:'out';
 const cats=S.cats.map(c=>`<option ${t&&t.cat===c?'selected':''}>${esc(c)}</option>`).join('');
 $('#form').innerHTML=`<div class="seg" id="seg"><button onclick="setType('out')" class="${type==='out'?'on':''}">Pengeluaran</button><button onclick="setType('in')" class="${type==='in'?'on':''}">Pemasukan</button></div>
 <label>Nominal (Rp)</label><input id="fa" inputmode="numeric" placeholder="0" oninput="fmtIn(this)" value="${t?t.amt.toLocaleString('id-ID'):''}" style="font-size:24px;font-weight:700">
 <div class="g2"><div><label>Kategori</label><select id="fc">${cats}</select></div><div><label>Subkategori</label><input id="fs" placeholder="mis. kopi" value="${t?esc(t.sub):''}"></div></div>
 <div class="g2"><div><label>Dompet</label><select id="fw">${S.wallets.map(w=>`<option value="${w.id}" ${(t?t.wallet:S.lastWallet)===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div><label>Tanggal</label><input id="fd" type="date" value="${t?t.date:today()}"></div></div>
 <label>Catatan</label><input id="fn" placeholder="Opsional" value="${t?esc(t.note):''}">
 <button class="btn" onclick="saveTx()">${t?'Simpan perubahan':'Simpan'}</button>${t?'<button class="btn del" onclick="delTx()">Hapus transaksi</button>':''}<button class="btn alt" onclick="closeSheet()">Batal</button>`;
 $('#sheet').classList.add('show');if(!t)setTimeout(()=>$('#fa').focus(),50)}
function setType(t){type=t;[...$('#seg').children].forEach((b,i)=>b.classList.toggle('on',(i===0)===(t==='out')))}
function closeSheet(){$('#sheet').classList.remove('show')}
function saveTx(){
 const amt=num($('#fa').value);if(!amt)return alert('Isi nominal dulu.');
 const d=$('#fd').value||today(),r={type,amt,cat:$('#fc').value,sub:$('#fs').value.trim(),wallet:$('#fw').value,date:d,note:$('#fn').value.trim()};
 if(editId){Object.assign(S.tx.find(t=>t.id===editId),r)}else S.tx.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)},r));
 S.lastWallet=r.wallet;save();mon=d.slice(0,7);closeSheet();render()}
function delTx(){if(confirm('Hapus transaksi ini?')){S.tx=S.tx.filter(t=>t.id!==editId);save();closeSheet();render()}}
function stamp(){S.lastBackup=Date.now();save();render()}
async function out(name,text,mime){
 const f=new File([text],name,{type:mime});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();return true}
async function exp(){if(await out('catatan-uang-'+today()+'.json',JSON.stringify(S),'application/json'))stamp()}
function exCsv(){const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
 out('catatan-uang-'+today()+'.csv',['Tanggal,Jenis,Nominal,Kategori,Subkategori,Dompet,Catatan'].concat(S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.amt,c(t.cat),c(t.sub),c(wname(t.wallet)),c(t.note)].join(','))).join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!Array.isArray(d.wallets))throw 0;
 if(!confirm('Data sekarang akan diganti dengan isi file ('+d.tx.length+' transaksi). Lanjutkan?'))return;S=d;save();alert('Data berhasil dipulihkan.');render()}catch(e){alert('File tidak dikenali. Pilih file backup dari aplikasi ini.')}};r.readAsText(f)}
function go(t){tab=t;render();scrollTo(0,0)}
function nav(){const b=(id,l)=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${l}</button>`;
 $('#nav').innerHTML=b('home','Beranda')+b('list','Transaksi')+'<button class="add" onclick="openSheet()" aria-label="Catat transaksi">+</button>'+b('bud','Anggaran')+b('set','Pengaturan')}
function render(){nav();$('#app').innerHTML={home,list,bud:budget,set:settings}[tab]()}
function renderKeep(){const p=$('#qi').selectionStart;render();const i=$('#qi');i.focus();i.setSelectionRange(p,p)}
load();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
